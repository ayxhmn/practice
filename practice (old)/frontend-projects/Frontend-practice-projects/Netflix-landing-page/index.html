<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Landing Page Clone🍿</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="public/logo.svg" type="image/svg+xml">
</head>
<body>
    <div id="bg-wrapper">
        <div id="bg-overlay"></div>
    </div>

    <header>
        <div id="header-top">
            <img id="header-logo" src="public/logo-full-word.svg" alt="Netflix logo">
            <div id="header-right">
                <a id="lang-btn" href="">English</a>
                <a id="sign-in-btn" href="">Sign In</a>
            </div>
        </div>
        <nav>
            <a href="">Popular Now</a>
            <a href="">Plans</a>
            <a href="">Reasons to Join</a>
            <a href="">FAQ</a>
        </nav>
    </header>

    <div id="bg-screen"> <!-- Need to understand this div -->
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="tv-curve">
                <path d="M0,0 H100 V90 C75,70 25,70 0,90 Z"/>
              </clipPath>
            </defs>
            <image 
              href="public/background.png" 
              width="100%" 
              height="100%"
              preserveAspectRatio="xMidYMid meet"
              clip-path="url(#tv-curve)" 
            />
          </svg>
    </div>
    
    <!-- gen -->
    <div id="hero-text">
        <h1>Unlimited movies,<br>TV shows and<br> more</h1>
        <p class="subtext">Starts at ₹149. Cancel at any time.</p>
        <p class="description">
          Ready to watch? Enter your email to create or restart your membership.
        </p>
        <form class="signup-form">
          <input type="email" placeholder="Email address" required />
          <button type="submit">Get Started ➤</button>
        </form>
    </div>
</body>
</html>
