<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Drum Kit!🔥</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="public/favicon.png" type="image/png">
</head>
<body>
    <div id="header">
        <h1>SIMPLE DRUM KIT🎛️</h1>
    </div>

    <div id="btk-bar">
        <div id="drum">DRUM🥁</div>
        <div id="hi-hat">HI-HAT✨</div>
        <div id="snare">SNARE⚡</div>
        <div id="bass">BASS🔥</div>
    </div>

    <div id="instructions">
        <h3>How to play:</h3>
        <p>1. Press 'j' for Drum</p>
        <p>2. Press 'k' for Hi-Hat</p>
        <p>3. Press 'l' for Snare</p>
        <p>4. Press 'i' for Bass</p>
    </div>

    <div id="credit">Created by BatMan🦇 (20/04/2025)</div>

    <script src="index.js"></script>
</body>
</html>
