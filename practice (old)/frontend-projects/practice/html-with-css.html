<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="html-with-css-styles.css">
    <title>Hello, CSS!</title>
</head>
<body>
    <nav id="top-bar">
        <a href="" class="top-bar-button">Home</a>
        <a href="" class="top-bar-button">Departments</a>
        <a href="" class="top-bar-button">Activities</a>
        <a href="" class="top-bar-button">Admissions</a>
        <a href="" class="top-bar-button">Placement</a>
    </nav>

    <div id="sign-up-section">
        <p>Welcome, please sign up!</p>
        <label for="full-name">Full name:</label>
        <input type="text" name="full-name" id="full-name" placeholder="full name"><br>
        <label for="email">Email address:</label>
        <input type="text" name="email" id="email" placeholder="user@email.com"><br>
        <label for="password">Password:</label>
        <input type="text" name="password" id="password" placeholder="password.."><br>
        <label for="confirm-password">Confirm password:</label>
        <input type="text" name="confirm password" id="confirm-password" placeholder="retype password.."><br>
        <button>Sign up!</button>
    </div>

    <div id="rotate-div">
        <p>Hover over me to make me bend!</p>
    </div>
</body>
</html>
